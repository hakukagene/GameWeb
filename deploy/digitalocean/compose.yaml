name: storyplay
services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "8000"
      GAME_PORT: "8001"
      APP_ORIGIN: "https://${SITE_HOST:?Set SITE_HOST in .env}"
      GAME_ORIGIN: "https://${GAME_HOST:?Set GAME_HOST in .env}"
      DB_PATH: /state/data/storyplay.sqlite
      GAME_CONTENT_ROOT: /state/game-content
      DEMO_PURCHASES: "false"
      ADMIN_GAME_PREVIEW: "true"
      TRUST_PROXY_LOOPBACK: "true"
    volumes:
      - /srv/storyplay/data:/state/data
      - /srv/storyplay/game-content:/state/game-content
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 11m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      SITE_HOST: "${SITE_HOST:?Set SITE_HOST in .env}"
      GAME_HOST: "${GAME_HOST:?Set GAME_HOST in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/storyplay/caddy-data:/data
      - /srv/storyplay/caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
